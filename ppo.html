<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ضغط الصور إلى حجم محدد (تقريبًا 200KB)</title>
  <style>
    :root{
      --bg:#0f172a; /* slate-900 */
      --card:#111827ee; /* gray-900 */
      --muted:#94a3b8; /* slate-400 */
      --text:#e5e7eb; /* gray-200 */
      --accent:#22d3ee; /* cyan-400 */
      --accent-2:#10b981; /* emerald-500 */
      --danger:#ef4444; /* red-500 */
      --ring: 0 0 0 3px rgba(34,211,238,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:radial-gradient(1200px 600px at 20% -10%, #1f2937 0%, var(--bg) 40%),radial-gradient(1200px 600px at 120% 120%, #111827 0%, var(--bg) 30%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,Arial,sans-serif;}
    .container{max-width:1100px;margin:40px auto;padding:20px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);backdrop-filter: blur(6px);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .header{display:flex;gap:14px;align-items:center}
    .logo{width:42px;height:42px;border-radius:12px;background:conic-gradient(from 220deg, var(--accent), var(--accent-2));display:grid;place-items:center;color:#002b36;font-weight:800}
    h1{font-size:clamp(20px,3.5vw,30px);margin:0}
    p{color:var(--muted)}
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:16px}
    .field{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.03);padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.08)}
    .field label{font-size:13px;color:#cbd5e1}
    .field input[type="number"], .field input[type="text"], .field select{
      appearance:none;background:#0b1220;border:1px solid rgba(255,255,255,.1);color:var(--text);padding:10px 12px;border-radius:12px;outline:none
    }
    .field input[type="number"]:focus, .field select:focus{box-shadow:var(--ring);border-color:var(--accent)}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .btn{cursor:pointer;border:none;padding:12px 16px;border-radius:14px;font-weight:600}
    .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#032b2b}
    .btn-outline{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--text)}
    .dropzone{border:2px dashed rgba(255,255,255,.18);border-radius:16px;padding:22px;text-align:center;color:var(--muted);transition:.2s}
    .dropzone.drag{border-color:var(--accent);color:var(--text);box-shadow:var(--ring)}
    .grid{display:grid;grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:16px}
    .item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
    .thumb{display:grid;place-items:center;background:#0b1220}
    .thumb img{width:100%;height:220px;object-fit:contain;background:#0b1220}
    .meta{padding:12px}
    .stat{display:flex;justify-content:space-between;font-size:13px;color:#cbd5e1;margin:6px 0}
    .progress{height:6px;background:#0b1220;border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
    .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
    .bad{color:var(--danger)}
    .good{color:var(--accent-2)}
    .footer{margin-top:10px;display:flex;gap:10px}
    .small{font-size:12px}
  </style>
</head>
<body>
  <div class="container">
    <div class="card" style="padding:18px 18px 6px 18px;">
      <div class="header">
        <div class="logo">IC</div>
        <div>
          <h1>ضغط الصور إلى حجم محدد مع الحفاظ على الجودة</h1>
          <p class="small">يعمل بالكامل داخل المتصفح (بدون رفع ملفات). اختر الصور وسيحاول ضغطها للوصول إلى الحجم المطلوب لكل ملف.</p>
        </div>
      </div>
      <div class="controls">
        <div class="field">
          <label>الحجم المستهدف (كيلوبايت)</label>
          <input id="targetKB" type="number" min="20" step="10" value="200" />
        </div>
        <div class="field">
          <label>أقصى عرض/ارتفاع (بالبكسل)</label>
          <input id="maxDim" type="number" min="256" step="64" value="1920" />
        </div>
        <div class="field">
          <label>التنسيق المفضّل للإخراج</label>
          <select id="format">
            <option value="auto" selected>تلقائي (يختار الأفضل)</option>
            <option value="image/webp">WebP</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG* (قد لا يقلّ الحجم)</option>
          </select>
        </div>
        <div class="field">
          <label>الجودة الابتدائية (0–1)</label>
          <input id="startQ" type="number" min="0.1" max="1" step="0.05" value="0.92" />
        </div>
      </div>
      <div class="row" style="margin:16px 0 8px 0;">
        <input id="fileInput" type="file" accept="image/*" multiple class="btn btn-outline" />
        <button id="clearBtn" class="btn btn-outline">مسح القائمة</button>
      </div>
      <div id="dropzone" class="dropzone small">اسحب الصور هنا أو استخدم زر الاختيار بالأعلى</div>
    </div><div style="height:18px"></div>

<div id="list" class="grid"></div>

<p class="small" style="opacity:.8;margin-top:14px">تم التصميم بواسطة استاذ جرجس عادل -المحامي.</p>

  </div><script>
// ======= أدوات مساعدة =======
const $ = (s) => document.querySelector(s);
const formatBytes = (b) => {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
};

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function fitWithin(w, h, maxDim){
  const scale = Math.min(1, maxDim / Math.max(w, h));
  return { w: Math.round(w * scale), h: Math.round(h * scale), scale };
}

async function imgFromFile(file){
  const url = URL.createObjectURL(file);
  try{
    if ('createImageBitmap' in window){
      const bmp = await createImageBitmap(await (await fetch(url)).blob());
      URL.revokeObjectURL(url);
      return {img: bmp, revoke: ()=>bmp.close && bmp.close()};
    }
    return await new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload = ()=>resolve({img, revoke: ()=>URL.revokeObjectURL(url)});
      img.onerror = reject;
      img.src = url;
    });
  }catch(e){ URL.revokeObjectURL(url); throw e; }
}

function drawToCanvas(img, w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  // تحسين بسيط للجودة عند التصغير
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);
  return c;
}

async function canvasToBlob(canvas, type, quality){
  return await new Promise(res=>canvas.toBlob(res, type, quality));
}

async function compressToTarget(canvas, { targetBytes, startQ=0.92, typeHint='auto' }){
  // إن كان PNG والهدف صغير جدًا قد لا نصل، سنجرّب WebP/JPEG
  const supportsWebP = canvas.toDataURL('image/webp').startsWith('data:image/webp');
  const tryTypes = [];
  if (typeHint === 'auto'){
    if (supportsWebP) tryTypes.push('image/webp');
    tryTypes.push('image/jpeg');
    tryTypes.push('image/png');
  } else {
    tryTypes.push(typeHint);
    if (typeHint !== 'image/webp' && supportsWebP) tryTypes.push('image/webp');
    if (typeHint !== 'image/jpeg') tryTypes.push('image/jpeg');
    if (typeHint !== 'image/png') tryTypes.push('image/png');
  }

  let best = null;

  for (const type of tryTypes){
    // PNG لا يستخدم quality عادةً، لكن نحاول مرة واحدة
    if (type === 'image/png'){
      const b = await canvasToBlob(canvas, type, 1);
      if (!best || b.size < best.size) best = b;
      continue;
    }

    // بحث ثنائي على الجودة
    let lo = 0.2, hi = 0.98; // حدود معقولة
    let q = clamp(startQ, lo, hi);
    let candidate = await canvasToBlob(canvas, type, q);

    for (let i=0; i<9; i++){
      if (candidate.size > targetBytes){
        hi = q; q = (lo + q)/2;
      } else {
        lo = q; q = (q + hi)/2;
      }
      const next = await canvasToBlob(canvas, type, q);
      // اختر الأقرب تحت الهدف إن أمكن
      if (next.size <= targetBytes || next.size < candidate.size) candidate = next;
    }

    if (!best || candidate.size < best.size) best = candidate;
    if (best.size <= targetBytes) break; // وصلنا الهدف
  }

  return best;
}

async function smartCompress(file, opts){
  const targetBytes = (opts.targetKB || 200) * 1024;
  const {img, revoke} = await imgFromFile(file);
  try{
    const natW = img.width || img.naturalWidth; const natH = img.height || img.naturalHeight;
    const maxDim = opts.maxDim || 1920;

    // تقدير مبدئي لمقياس التصغير من نسبة الحجم المطلوبة (تقريبية)
    // نفترض أن الحجم يتناسب تقريبًا مع عدد البكسلات، فنأخذ الجذر التربيعي للنسبة
    let scaleGuess = 1;
    if (file.size > 0){
      const ratio = targetBytes / file.size;
      scaleGuess = Math.min(1, Math.sqrt(ratio) * 1.1);
    }

    // طبّق القيود
    const byMax = fitWithin(natW, natH, maxDim);
    const w0 = Math.max(1, Math.min(natW, Math.round(natW * scaleGuess), byMax.w));
    const h0 = Math.max(1, Math.min(natH, Math.round(natH * scaleGuess), byMax.h));

    let canvas = drawToCanvas(img, w0, h0);

    // المحاولة 1: ضغط بجودة مناسبة
    let blob = await compressToTarget(canvas, { targetBytes, startQ: opts.startQ || 0.92, typeHint: opts.typeHint || 'auto' });

    // إن لم نصل للهدف، صغّر الأبعاد تدريجيًا مع الحفاظ على الجودة المعقولة
    let tries = 0;
    while (blob.size > targetBytes && tries < 4 && (canvas.width > 512 || canvas.height > 512)){
      const nw = Math.round(canvas.width * 0.85);
      const nh = Math.round(canvas.height * 0.85);
      const tmp = drawToCanvas(img, nw, nh);
      canvas = tmp;
      blob = await compressToTarget(canvas, { targetBytes, startQ: opts.startQ || 0.9, typeHint: opts.typeHint || 'auto' });
      tries++;
    }

    return { blob, width: canvas.width, height: canvas.height, original: {w:natW,h:natH,size:file.size} };
  } finally { revoke && revoke(); }
}

function createItem(file){
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `
    <div class="thumb"><img alt="preview"/></div>
    <div class="meta">
      <div class="stat"><span>الملف:</span><strong>${file.name}</strong></div>
      <div class="stat"><span>الحجم الأصلي:</span><span>${formatBytes(file.size)}</span></div>
      <div class="stat"><span>الجودة:</span><span class="q">—</span></div>
      <div class="progress"><div class="bar"></div></div>
      <div class="stat"><span>الحجم بعد الضغط:</span><span class="outSize">—</span></div>
      <div class="stat"><span>الأبعاد:</span><span class="dims">—</span></div>
      <div class="footer">
        <button class="btn btn-primary dl" disabled>تنزيل</button>
        <button class="btn btn-outline again" disabled>إعادة المحاولة</button>
      </div>
    </div>`;

  const imgTag = el.querySelector('img');
  imgTag.src = URL.createObjectURL(file);
  imgTag.onload = () => URL.revokeObjectURL(imgTag.src);
  return el;
}

async function handleFiles(files){
  const targetKB = +$('#targetKB').value || 200;
  const maxDim = +$('#maxDim').value || 1920;
  const startQ = +$('#startQ').value || 0.92;
  const typeHint = $('#format').value || 'auto';

  for (const file of files){
    const card = createItem(file);
    $('#list').prepend(card);
    const bar = card.querySelector('.bar');
    const qSpan = card.querySelector('.q');
    const outSize = card.querySelector('.outSize');
    const dims = card.querySelector('.dims');
    const dlBtn = card.querySelector('.dl');
    const againBtn = card.querySelector('.again');

    // تقدّم شكلي
    let progress = 10; bar.style.width = progress + '%';

    try{
      const r = await smartCompress(file, { targetKB, maxDim, startQ, typeHint });
      progress = 90; bar.style.width = progress + '%';

      const sizeOK = r.blob.size <= targetKB*1024;
      qSpan.textContent = sizeOK ? 'ضمن الهدف' : 'أقرب حجم ممكن';
      qSpan.className = 'q ' + (sizeOK ? 'good' : 'bad');
      outSize.textContent = formatBytes(r.blob.size) + (sizeOK ? '' : ' (أكبر من الهدف قليلًا)');
      dims.textContent = `${r.width}×${r.height} (من ${r.original.w}×${r.original.h})`;

      const ext = (r.blob.type.includes('webp') ? 'webp' : r.blob.type.includes('png') ? 'png' : 'jpg');
      const name = file.name.replace(/\.[^.]+$/, '') + `-compressed.${ext}`;
      const url = URL.createObjectURL(r.blob);

      dlBtn.disabled = false;
      againBtn.disabled = false;
      dlBtn.onclick = ()=>{ const a=document.createElement('a'); a.href=url; a.download=name; a.click(); };
      againBtn.onclick = async ()=>{
        dlBtn.disabled = true; againBtn.disabled = true; bar.style.width = '0%'; qSpan.textContent = '—'; outSize.textContent = '—'; dims.textContent = '—';
        URL.revokeObjectURL(url);
        await handleFiles([file]);
        card.remove();
      };

      bar.style.width = '100%';
    }catch(err){
      console.error(err);
      qSpan.textContent = 'فشل الضغط'; qSpan.className = 'q bad';
      outSize.textContent = 'حدث خطأ';
    }
  }
}

// أحداث الواجهة
$('#fileInput').addEventListener('change', (e)=> handleFiles(e.target.files));
$('#clearBtn').addEventListener('click', ()=> $('#list').innerHTML = '');

const dz = $('#dropzone');
;['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev, (e)=>{ e.preventDefault(); dz.classList.add('drag'); }));
;['dragleave','drop'].forEach(ev=> dz.addEventListener(ev, (e)=>{ e.preventDefault(); if(ev==='drop'){ const files = [...e.dataTransfer.files].filter(f=>/^image\//.test(f.type)); handleFiles(files); } dz.classList.remove('drag'); }));
</script></body>
</html>
